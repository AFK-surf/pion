name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (defaults to tag name without leading v, or 0.1.0)'
        required: false
        default: '0.1.0'

permissions:
  contents: read

jobs:
  build:
    name: Build & package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-15
            kind: macos
          - name: linux-x86_64
            os: ubuntu-latest
            kind: linux
          - name: linux-arm64
            os: ubuntu-24.04-arm
            kind: linux
          - name: windows-x86_64
            os: windows-latest
            kind: windows

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Linux build tools
        if: matrix.kind == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential python3 file libssl-dev openssl pkg-config libsqlite3-dev sqlite3

      - name: Setup MSYS2 (Windows)
        if: matrix.kind == 'windows'
        uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c # v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
            gzip
            diffutils

      - name: Bootstrap & package (macOS)
        if: matrix.kind == 'macos'
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          case "${GITHUB_REF_TYPE:-}:${GITHUB_REF:-}" in
            tag:*|*:refs/tags/*)
              VERSION="${GITHUB_REF_NAME#v}"
              ;;
            *)
              if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
                VERSION="${INPUT_VERSION}"
              else
                VERSION="${GITHUB_REF_NAME#v}"
              fi
              ;;
          esac
          case "$VERSION" in
            ""|*[!0-9A-Za-z.-]*)
              echo "error: invalid version (must be single-line ASCII semver): $VERSION" >&2
              exit 1
              ;;
          esac
          if ! printf '%s\n' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "error: invalid version (expected X.Y.Z or X.Y.Z-pre): $VERSION" >&2
            exit 1
          fi
          sh scripts/bootstrap.sh
          PION_VERSION="$VERSION" sh scripts/package-release.sh dist

      - name: Bootstrap & package (Linux)
        if: matrix.kind == 'linux'
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          case "${GITHUB_REF_TYPE:-}:${GITHUB_REF:-}" in
            tag:*|*:refs/tags/*)
              VERSION="${GITHUB_REF_NAME#v}"
              ;;
            *)
              if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
                VERSION="${INPUT_VERSION}"
              else
                VERSION="${GITHUB_REF_NAME#v}"
              fi
              ;;
          esac
          case "$VERSION" in
            ""|*[!0-9A-Za-z.-]*)
              echo "error: invalid version (must be single-line ASCII semver): $VERSION" >&2
              exit 1
              ;;
          esac
          if ! printf '%s\n' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "error: invalid version (expected X.Y.Z or X.Y.Z-pre): $VERSION" >&2
            exit 1
          fi
          sh scripts/test-linux.sh
          PION_VERSION="$VERSION" PIONC="$PWD/out/pionc_linux" sh scripts/package-release.sh dist

      - name: Bootstrap & package (Windows)
        if: matrix.kind == 'windows'
        shell: msys2 {0}
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          case "${GITHUB_REF_TYPE:-}:${GITHUB_REF:-}" in
            tag:*|*:refs/tags/*)
              VERSION="${GITHUB_REF_NAME#v}"
              ;;
            *)
              if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
                VERSION="${INPUT_VERSION}"
              else
                VERSION="${GITHUB_REF_NAME#v}"
              fi
              ;;
          esac
          case "$VERSION" in
            ""|*[!0-9A-Za-z.-]*)
              echo "error: invalid version (must be single-line ASCII semver): $VERSION" >&2
              exit 1
              ;;
          esac
          if ! printf '%s\n' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "error: invalid version (expected X.Y.Z or X.Y.Z-pre): $VERSION" >&2
            exit 1
          fi
          sh scripts/test-windows.sh
          PION_VERSION="$VERSION" PIONC="$PWD/out/pionc_win.exe" sh scripts/package-release.sh dist

      - name: Upload release archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all platform archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: dist-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        run: |
          cd release-assets
          cat *.sha256 | LC_ALL=C sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/*.sha256
            release-assets/SHA256SUMS.txt
