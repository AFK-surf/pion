name: release

# Prebuilt toolchains for macOS ARM64, Linux x86_64, Linux ARM64 and Windows x86_64.
# - push of a tag `vX.Y.Z[-pre]`: build, self-check and publish the GitHub Release.
# - workflow_dispatch (on any ref, tags included): dry run (default version 0.1.0-dev); same builds and checks,
#   assets are uploaded as a workflow artifact and nothing is published.
# Each archive holds `pionc` built by the seed -> stage 1 -> `--release` chain of
# scripts/build-release.sh and passes the zero-env self-check of scripts/package-release.sh.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Dry-run version (X.Y.Z or X.Y.Z-pre; empty = 0.1.0-dev). Nothing is published.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Record job start
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - id: v
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          # Only a pushed tag releases; a manual run (even on a tag ref) is a dry run.
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${INPUT_VERSION:-0.1.0-dev}"
          fi
          # SemVer 2.0 without build metadata (`+` is not allowed in archive names).
          if ! printf '%s\n' "$VERSION" | grep -Eqx '(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?'; then
            echo "error: invalid version '$VERSION' (expected X.Y.Z or X.Y.Z-pre)" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Pion release version: $VERSION (ref $GITHUB_REF)"

      - name: Check 60s duration target
        if: always()
        run: |
          ELAPSED=$(( $(date +%s) - JOB_START_EPOCH ))
          echo "Job version duration: ${ELAPSED}s"
          if [ "$ELAPSED" -gt 60 ]; then
            echo "::warning title=CI duration > 60s::version took ${ELAPSED}s (target <= 60s, hard timeout 180s)"
          fi

  build-macos-arm64:
    name: Build & package (darwin-arm64)
    needs: version
    runs-on: macos-15
    timeout-minutes: 3
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Record job start
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build qbe, libpionrt.a (< 64 KB) and pionc_release (seed -> pionc1 -> --release)
        run: sh scripts/build-release.sh

      - name: Package & zero-env self-check
        run: |
          PION_VERSION="$VERSION" PIONC="$PWD/out/pionc_release" PION_QBE="$PWD/out/qbe" \
            PION_RT_LIB="$PWD/out/libpionrt.a" sh scripts/package-release.sh dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pion-darwin-arm64
          path: |
            dist/pion-*.tar.gz
            dist/pion-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Check 60s duration target
        if: always()
        run: |
          ELAPSED=$(( $(date +%s) - JOB_START_EPOCH ))
          echo "Job build-macos-arm64 duration: ${ELAPSED}s"
          if [ "$ELAPSED" -gt 60 ]; then
            echo "::warning title=CI duration > 60s::build-macos-arm64 took ${ELAPSED}s (target <= 60s, hard timeout 180s)"
          fi

  build-linux-x86_64:
    name: Build & package (linux-x86_64)
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Record job start
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential python3

      - name: Build qbe, libpionrt.a (< 64 KB) and pionc_release (seed -> s3 -> --release)
        run: sh scripts/build-release.sh

      - name: Package & zero-env self-check
        run: |
          PION_VERSION="$VERSION" PIONC="$PWD/out/pionc_release" PION_QBE="$PWD/out/qbe" \
            PION_RT_LIB="$PWD/out/libpionrt.a" sh scripts/package-release.sh dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pion-linux-x86_64
          path: |
            dist/pion-*.tar.gz
            dist/pion-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Check 60s duration target
        if: always()
        run: |
          ELAPSED=$(( $(date +%s) - JOB_START_EPOCH ))
          echo "Job build-linux-x86_64 duration: ${ELAPSED}s"
          if [ "$ELAPSED" -gt 60 ]; then
            echo "::warning title=CI duration > 60s::build-linux-x86_64 took ${ELAPSED}s (target <= 60s, hard timeout 180s)"
          fi

  build-linux-arm64:
    name: Build & package (linux-arm64)
    needs: version
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 3
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Record job start
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential python3

      - name: Build qbe, libpionrt.a (< 64 KB, -Os hard gate) and pionc_release (seed -> s3 -> --release)
        run: sh scripts/build-release.sh

      - name: Package & zero-env self-check
        run: |
          PION_VERSION="$VERSION" PIONC="$PWD/out/pionc_release" PION_QBE="$PWD/out/qbe" \
            PION_RT_LIB="$PWD/out/libpionrt.a" sh scripts/package-release.sh dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pion-linux-arm64
          path: |
            dist/pion-*.tar.gz
            dist/pion-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Check 60s duration target
        if: always()
        run: |
          ELAPSED=$(( $(date +%s) - JOB_START_EPOCH ))
          echo "Job build-linux-arm64 duration: ${ELAPSED}s"
          if [ "$ELAPSED" -gt 60 ]; then
            echo "::warning title=CI duration > 60s::build-linux-arm64 took ${ELAPSED}s (target <= 60s, hard timeout 180s)"
          fi

  build-windows-x86_64:
    name: Build & package (windows-x86_64)
    needs: version
    runs-on: windows-latest
    timeout-minutes: 3
    defaults:
      run:
        shell: msys2 {0}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Record job start
        shell: pwsh
        run: |
          $epoch = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          "JOB_START_EPOCH=$epoch" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c # v2
        with:
          msystem: UCRT64
          update: false
          cache: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
            gzip
            diffutils

      - name: Build qbe.exe, libpionrt.a (< 64 KB) and pionc_release.exe (seed -> s3 -> --release)
        run: sh scripts/build-release.sh

      - name: Package & zero-env self-check
        run: |
          PION_VERSION="$VERSION" PION_REQUIRE_DLL_CHECK=1 \
            PIONC="$PWD/out/pionc_release.exe" PION_QBE="$PWD/out/qbe.exe" \
            PION_RT_LIB="$PWD/out/libpionrt.a" sh scripts/package-release.sh dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pion-windows-x86_64
          path: |
            dist/pion-*.zip
            dist/pion-*.zip.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Check 60s duration target
        if: always()
        shell: pwsh
        run: |
          $elapsed = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - [int64]$env:JOB_START_EPOCH
          Write-Host "Job build-windows-x86_64 duration: ${elapsed}s"
          if ($elapsed -gt 60) {
            Write-Host "::warning title=CI duration > 60s::build-windows-x86_64 took ${elapsed}s (target <= 60s, hard timeout 180s)"
          }

  publish:
    name: Verify & publish
    needs: [version, build-macos-arm64, build-linux-x86_64, build-linux-arm64, build-windows-x86_64]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Record job start
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: pion-*
          path: release-assets
          merge-multiple: true

      - name: Verify the 4 archives and their checksums, write SHA256SUMS
        working-directory: release-assets
        run: |
          set -eu
          ls -l
          expected=""
          for suffix in darwin-arm64.tar.gz linux-x86_64.tar.gz linux-arm64.tar.gz windows-x86_64.zip; do
            f="pion-${VERSION}-${suffix}"
            [ -s "$f" ] || { echo "error: missing $f" >&2; exit 1; }
            [ -s "$f.sha256" ] || { echo "error: missing $f.sha256" >&2; exit 1; }
            # Each .sha256 names exactly its own archive.
            [ "$(wc -l < "$f.sha256" | tr -d ' ')" = "1" ] || { echo "error: $f.sha256 is not one line" >&2; exit 1; }
            grep -Eq "^[0-9a-f]{64} [ *]$f\$" "$f.sha256" || { echo "error: $f.sha256 does not name $f" >&2; exit 1; }
            sha256sum -c "$f.sha256"
            expected="$expected $f $f.sha256"
          done
          actual=$(ls -1 | LC_ALL=C sort | tr '\n' ' ')
          want=$(printf '%s\n' $expected | LC_ALL=C sort | tr '\n' ' ')
          [ "$actual" = "$want" ] || { echo "error: unexpected asset set: $actual" >&2; exit 1; }
          sha256sum pion-*.tar.gz pion-*.zip > SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release (draft, verify all 9 assets, then make public)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          err_file=$(mktemp)
          trap 'rm -f "$err_file" && rm -rf verify-draft' EXIT
          if IS_DRAFT=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>"$err_file"); then
            :
          elif grep -qi 'release not found' "$err_file"; then
            IS_DRAFT=missing
          else
            cat "$err_file" >&2
            exit 1
          fi
          case "$IS_DRAFT" in
            false)
              echo "error: published release $TAG already exists; refusing to overwrite" >&2
              exit 1
              ;;
            true)
              # A draft left by an earlier failed run: replace its assets.
              gh release upload "$TAG" --clobber release-assets/*
              ;;
            missing)
              PRE=""
              case "$VERSION" in *-*) PRE="--prerelease" ;; esac
              gh release create "$TAG" --verify-tag --draft --title "Pion $TAG" --generate-notes $PRE release-assets/*
              ;;
            *)
              echo "error: unexpected isDraft for $TAG: $IS_DRAFT" >&2
              exit 1
              ;;
          esac
          want=$(cd release-assets && for f in *; do printf '%s %s\n' "$f" "$(wc -c < "$f" | tr -d ' ')"; done | LC_ALL=C sort)
          have=$(gh release view "$TAG" --json assets --jq '.assets[] | "\(.name) \(.size)"' | LC_ALL=C sort)
          if [ "$(printf '%s\n' "$have" | wc -l | tr -d ' ')" != "9" ] || [ "$have" != "$want" ]; then
            printf 'error: draft %s assets differ from release-assets/:\n--- want\n%s\n--- have\n%s\n' "$TAG" "$want" "$have" >&2
            exit 1
          fi
          mkdir -p verify-draft
          gh release download "$TAG" -D verify-draft
          (cd verify-draft && sha256sum -c SHA256SUMS)
          for f in release-assets/*; do
            cmp -s "$f" "verify-draft/$(basename "$f")" || { echo "error: downloaded draft asset mismatch: $(basename "$f")" >&2; exit 1; }
          done
          gh release edit "$TAG" --draft=false
          gh release view "$TAG"

      - name: Upload dry-run assets
        if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dry-run-${{ needs.version.outputs.version }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

      - name: Check 60s duration target
        if: always()
        run: |
          ELAPSED=$(( $(date +%s) - JOB_START_EPOCH ))
          echo "Job publish duration: ${ELAPSED}s"
          if [ "$ELAPSED" -gt 60 ]; then
            echo "::warning title=CI duration > 60s::publish took ${ELAPSED}s (target <= 60s, hard timeout 180s)"
          fi
