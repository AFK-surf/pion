name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-arm64-bootstrap:
    name: macOS ARM64 bootstrap (runtime, 9/9 self-host, core tests, fmt)
    runs-on: macos-15
    timeout-minutes: 3
    steps:
      - name: Record job start
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Toolchain versions
        run: |
          cc --version
          python3 --version

      - name: verify-all (--bootstrap-only)
        env:
          PION_REQUIRE_SANITIZERS: "1"
        run: sh scripts/verify-all.sh --bootstrap-only

      - name: Generate macOS ARM64 mbt2pion golden outputs for cross-host parity
        run: |
          PIONC="$PWD/out/pionc2"
          export PION_QBE="$PWD/out/qbe"
          export PION_RT_LIB="$PWD/out/libpionrt.a"
          python3 tools/mbt2pion_cli/tests/run_transpile_oracle.py \
            --emit-ci-golden "$PWD/out/mbt2pion-golden-macos" \
            --pionc "$PIONC"

      - name: Package prebuilt out/ for E2E shards
        run: tar -cf out-macos.tar out

      - name: Upload prebuilt macOS ARM64 out/
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: out-macos-arm64
          path: out-macos.tar
          if-no-files-found: error
          retention-days: 1

      - name: Upload macOS ARM64 fixed-point SSA for the cross-host parity check
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage-ssa-macos-arm64
          path: out/stage2.ssa
          if-no-files-found: error
          retention-days: 7

      - name: Upload macOS ARM64 mbt2pion golden outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mbt2pion-golden-macos
          path: out/mbt2pion-golden-macos
          if-no-files-found: error
          retention-days: 7

      - name: Check 60s duration target
        run: |
          ELAPSED=$(( $(date +%s) - JOB_START_EPOCH ))
          echo "Job macos-arm64-bootstrap duration: ${ELAPSED}s"
          if [ "$ELAPSED" -gt 60 ]; then
            echo "::warning title=CI duration > 60s::macos-arm64-bootstrap took ${ELAPSED}s (target <= 60s, hard timeout 180s)"
          fi

  macos-arm64-e2e:
    name: macOS ARM64 E2E (shard ${{ matrix.shard }}/4)
    runs-on: macos-15
    needs: [macos-arm64-bootstrap]
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Record job start
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download prebuilt macOS ARM64 out/
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: out-macos-arm64

      - name: Extract prebuilt out/
        run: tar -xf out-macos.tar

      - name: verify-all (--e2e-only --shard ${{ matrix.shard }}/4)
        env:
          PION_REQUIRE_SANITIZERS: "1"
        run: sh scripts/verify-all.sh --e2e-only --shard "${{ matrix.shard }}/4"

      - name: Check 60s duration target
        run: |
          ELAPSED=$(( $(date +%s) - JOB_START_EPOCH ))
          echo "Job macos-arm64-e2e (${{ matrix.shard }}/4) duration: ${ELAPSED}s"
          if [ "$ELAPSED" -gt 60 ]; then
            echo "::warning title=CI duration > 60s::macos-arm64-e2e-${{ matrix.shard }} took ${ELAPSED}s (target <= 60s, hard timeout 180s)"
          fi

  linux-x86_64-bootstrap:
    name: Linux x86_64 bootstrap (zero-as ELF64, Stage 3 == Stage 4, core tests)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Record job start
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: test-linux (--bootstrap-only)
        env:
          PION_REQUIRE_SANITIZERS: "1"
        run: sh scripts/test-linux.sh --bootstrap-only

      - name: Package prebuilt out/ for E2E shards
        run: tar -cf out-linux-x64.tar out

      - name: Upload prebuilt Linux x86_64 out/
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: out-linux-x64
          path: out-linux-x64.tar
          if-no-files-found: error
          retention-days: 1

      - name: Upload Linux x86_64 fixed-point SSA for the cross-host parity check
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage-ssa-linux-x64
          path: out/linux_stage.ssa
          if-no-files-found: error
          retention-days: 7

      - name: Check 60s duration target
        run: |
          ELAPSED=$(( $(date +%s) - JOB_START_EPOCH ))
          echo "Job linux-x86_64-bootstrap duration: ${ELAPSED}s"
          if [ "$ELAPSED" -gt 60 ]; then
            echo "::warning title=CI duration > 60s::linux-x86_64-bootstrap took ${ELAPSED}s (target <= 60s, hard timeout 180s)"
          fi

  linux-x86_64-e2e:
    name: Linux x86_64 E2E (shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    needs: [linux-x86_64-bootstrap]
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - name: Record job start
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install E2E libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev libsqlite3-dev sqlite3

      - name: Download prebuilt Linux x86_64 out/
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: out-linux-x64

      - name: Extract prebuilt out/
        run: tar -xf out-linux-x64.tar

      - name: test-linux (--e2e-only --shard ${{ matrix.shard }}/6)
        env:
          PION_REQUIRE_SANITIZERS: "1"
        run: sh scripts/test-linux.sh --e2e-only --shard "${{ matrix.shard }}/6"

      - name: Check 60s duration target
        run: |
          ELAPSED=$(( $(date +%s) - JOB_START_EPOCH ))
          echo "Job linux-x86_64-e2e (${{ matrix.shard }}/6) duration: ${ELAPSED}s"
          if [ "$ELAPSED" -gt 60 ]; then
            echo "::warning title=CI duration > 60s::linux-x86_64-e2e-${{ matrix.shard }} took ${ELAPSED}s (target <= 60s, hard timeout 180s)"
          fi

  stage-ssa-cross-host-parity:
    name: Self-hosting SSA macOS ARM64 == Linux x86_64 (byte-for-byte)
    runs-on: ubuntu-latest
    needs: [macos-arm64-bootstrap, linux-x86_64-bootstrap]
    timeout-minutes: 3
    steps:
      - name: Record job start
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Download macOS ARM64 fixed-point SSA
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: stage-ssa-macos-arm64
          path: macos

      - name: Download Linux x86_64 fixed-point SSA
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: stage-ssa-linux-x64
          path: linux

      - name: Enforce byte-for-byte equality
        run: |
          sha256sum macos/stage2.ssa linux/linux_stage.ssa
          cmp macos/stage2.ssa linux/linux_stage.ssa
          echo "PASS: macOS ARM64 == Linux x86_64 self-hosting SSA (byte-for-byte)"

      - name: Check 60s duration target
        run: |
          ELAPSED=$(( $(date +%s) - JOB_START_EPOCH ))
          echo "Job stage-ssa-cross-host-parity duration: ${ELAPSED}s"
          if [ "$ELAPSED" -gt 60 ]; then
            echo "::warning title=CI duration > 60s::stage-ssa-cross-host-parity took ${ELAPSED}s (target <= 60s, hard timeout 180s)"
          fi

  linux-arm64-bootstrap:
    name: Linux ARM64 bootstrap (aarch64 native, Stage 3 == Stage 4, core tests)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 3
    steps:
      - name: Record job start
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install clang for fast ARM64 ASan+UBSan QBE
        run: |
          if ! command -v clang >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends clang
          fi

      - name: test-linux (aarch64 --bootstrap-only)
        env:
          PION_REQUIRE_SANITIZERS: "1"
        run: sh scripts/test-linux.sh --bootstrap-only

      - name: Package prebuilt out/ for E2E shards
        run: tar -cf out-linux-arm64.tar out

      - name: Upload prebuilt Linux ARM64 out/
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: out-linux-arm64
          path: out-linux-arm64.tar
          if-no-files-found: error
          retention-days: 1

      - name: Check 60s duration target
        run: |
          ELAPSED=$(( $(date +%s) - JOB_START_EPOCH ))
          echo "Job linux-arm64-bootstrap duration: ${ELAPSED}s"
          if [ "$ELAPSED" -gt 60 ]; then
            echo "::warning title=CI duration > 60s::linux-arm64-bootstrap took ${ELAPSED}s (target <= 60s, hard timeout 180s)"
          fi

  linux-arm64-e2e:
    name: Linux ARM64 E2E (shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-24.04-arm
    needs: [linux-arm64-bootstrap]
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - name: Record job start
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install E2E libraries & clang
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libssl-dev libsqlite3-dev sqlite3

      - name: Download prebuilt Linux ARM64 out/
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: out-linux-arm64

      - name: Extract prebuilt out/
        run: tar -xf out-linux-arm64.tar

      - name: test-linux (aarch64 --e2e-only --shard ${{ matrix.shard }}/6)
        env:
          PION_REQUIRE_SANITIZERS: "1"
        run: sh scripts/test-linux.sh --e2e-only --shard "${{ matrix.shard }}/6"

      - name: Check 60s duration target
        run: |
          ELAPSED=$(( $(date +%s) - JOB_START_EPOCH ))
          echo "Job linux-arm64-e2e (${{ matrix.shard }}/6) duration: ${ELAPSED}s"
          if [ "$ELAPSED" -gt 60 ]; then
            echo "::warning title=CI duration > 60s::linux-arm64-e2e-${{ matrix.shard }} took ${ELAPSED}s (target <= 60s, hard timeout 180s)"
          fi

  windows-x86_64-bootstrap:
    name: Windows x86_64 bootstrap (amd64_win, Stage 3 == Stage 4)
    runs-on: windows-latest
    timeout-minutes: 3
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Record job start
        shell: pwsh
        run: |
          $epoch = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          "JOB_START_EPOCH=$epoch" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c # v2
        with:
          msystem: UCRT64
          update: false
          cache: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-openssl
            gzip
            diffutils

      - name: Locate the runner's Python
        shell: pwsh
        run: |
          $py = (Get-Command python.exe -ErrorAction Stop).Source
          & $py --version
          "PION_WIN_PYTHON=$py" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: test-windows (x86_64 --bootstrap-only)
        run: |
          PY_EXE="$(cygpath -u "$PION_WIN_PYTHON")"
          export PATH="$PATH:$(dirname "$PY_EXE")"
          if ! command -v python3 >/dev/null 2>&1; then
            PY_SHIM="$(mktemp -d)"
            printf '#!/bin/sh\nexec "%s" "$@"\n' "$PY_EXE" > "$PY_SHIM/python3"
            chmod +x "$PY_SHIM/python3"
            export PATH="$PATH:$PY_SHIM"
          fi
          sh scripts/test-windows.sh --bootstrap-only
          tar -cf out-win-x64.tar out

      - name: Upload prebuilt Windows x86_64 out/
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: out-win-x64
          path: out-win-x64.tar
          if-no-files-found: error
          retention-days: 1

      - name: Check 60s duration target
        shell: pwsh
        run: |
          $elapsed = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - [int64]$env:JOB_START_EPOCH
          Write-Host "Job windows-x86_64-bootstrap duration: ${elapsed}s"
          if ($elapsed -gt 60) {
            Write-Host "::warning title=CI duration > 60s::windows-x86_64-bootstrap took ${elapsed}s (target <= 60s, hard timeout 180s)"
          }

  windows-x86_64-e2e:
    name: Windows x86_64 E2E (core, std, p98, p120, tls, benchmarks)
    runs-on: windows-latest
    needs: [windows-x86_64-bootstrap]
    timeout-minutes: 3
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Record job start
        shell: pwsh
        run: |
          $epoch = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          "JOB_START_EPOCH=$epoch" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c # v2
        with:
          msystem: UCRT64
          update: false
          cache: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-openssl
            gzip
            diffutils

      - name: Locate the runner's Python
        shell: pwsh
        run: |
          $py = (Get-Command python.exe -ErrorAction Stop).Source
          & $py --version
          "PION_WIN_PYTHON=$py" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download prebuilt Windows x86_64 out/
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: out-win-x64

      - name: test-windows (x86_64 --e2e-only)
        run: |
          tar -xf out-win-x64.tar
          PY_EXE="$(cygpath -u "$PION_WIN_PYTHON")"
          export PATH="$PATH:$(dirname "$PY_EXE")"
          if ! command -v python3 >/dev/null 2>&1; then
            PY_SHIM="$(mktemp -d)"
            printf '#!/bin/sh\nexec "%s" "$@"\n' "$PY_EXE" > "$PY_SHIM/python3"
            chmod +x "$PY_SHIM/python3"
            export PATH="$PATH:$PY_SHIM"
          fi
          python3 --version
          command -v openssl >/dev/null || { echo "FAIL: openssl CLI missing (std/tls e2e would be skipped)" >&2; exit 1; }
          sh scripts/test-windows.sh --e2e-only

      - name: Check 60s duration target
        shell: pwsh
        run: |
          $elapsed = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - [int64]$env:JOB_START_EPOCH
          Write-Host "Job windows-x86_64-e2e duration: ${elapsed}s"
          if ($elapsed -gt 60) {
            Write-Host "::warning title=CI duration > 60s::windows-x86_64-e2e took ${elapsed}s (target <= 60s, hard timeout 180s)"
          }

  mbt2pion:
    name: mbt2pion + mbt_compat (fmt, check, test, wasm32, e2e, hygiene & oracle)
    runs-on: ubuntu-latest
    needs: [linux-x86_64-bootstrap]
    timeout-minutes: 3
    steps:
      - name: Record job start
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache MoonBit CLI
        id: cache-moon
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.moon
          key: moon-cli-linux-x64-v1

      - name: Install MoonBit CLI
        run: |
          if [ ! -x "$HOME/.moon/bin/moon" ]; then
            curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          fi
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          "$HOME/.moon/bin/moon" version

      - name: Download prebuilt Linux x86_64 out/
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: out-linux-x64

      - name: Extract prebuilt out/
        run: tar -xf out-linux-x64.tar

      - name: fmt, check, test, wasm32, e2e, hygiene & mandatory 3-target differential oracles
        env:
          PION_QBE: ${{ github.workspace }}/out/qbe
          PION_RT_LIB: ${{ github.workspace }}/out/libpionrt.a
        run: |
          PIONC="$PWD/out/pionc_linux"
          command -v moon >/dev/null 2>&1 || { echo "FAIL: moon CLI missing" >&2; exit 1; }
          "$PIONC" fmt --check --json tools/mbt_compat tools/mbt2pion tools/mbt2pion_cli | grep -q '"ok":true'
          # Project-agnostic hygiene check
          if grep -rnE '\b([Mm]onoid|still\.fail|[Ii]nvar)\b|\b(signals|view)::' tools/mbt_compat/src/ tools/mbt2pion/src/ tools/mbt2pion_cli/src/; then
            echo "FAIL: forbidden project-specific identifier found in tools/mbt*" >&2
            exit 1
          fi
          # Run pkg check+test, sharded E2E, golden emission & all 15 mandatory 3-target differential oracles concurrently.
          export PIONC
          sh scripts/run-e2e-parallel.sh <<'CMDS'
          "$PIONC" check --json tools/mbt_compat | grep -q '"ok":true' && OUT="$("$PIONC" test --json tools/mbt_compat)" && echo "tools/mbt_compat -> $OUT" && printf '%s' "$OUT" | grep -q '"ok":true' && printf '%s' "$OUT" | grep -q '"failed":0'
          "$PIONC" check --json tools/mbt2pion | grep -q '"ok":true' && OUT="$("$PIONC" test --json tools/mbt2pion)" && echo "tools/mbt2pion -> $OUT" && printf '%s' "$OUT" | grep -q '"ok":true' && printf '%s' "$OUT" | grep -q '"failed":0'
          "$PIONC" check --json tools/mbt2pion_cli | grep -q '"ok":true' && OUT="$("$PIONC" test --json tools/mbt2pion_cli)" && echo "tools/mbt2pion_cli -> $OUT" && printf '%s' "$OUT" | grep -q '"ok":true' && printf '%s' "$OUT" | grep -q '"failed":0'
          PION_SHARD=0/4 sh tools/mbt2pion_cli/tests/run_e2e.sh "$PIONC"
          PION_SHARD=1/4 sh tools/mbt2pion_cli/tests/run_e2e.sh "$PIONC"
          PION_SHARD=2/4 sh tools/mbt2pion_cli/tests/run_e2e.sh "$PIONC"
          PION_SHARD=3/4 sh tools/mbt2pion_cli/tests/run_e2e.sh "$PIONC"
          sh tools/mbt2pion_cli/tests/run_d2_e2e.sh "$PIONC"
          sh tools/mbt2pion_cli/tests/run_e1_e2e.sh "$PIONC"
          python3 tools/mbt_compat/oracle/run_oracle.py --no-bench --pionc "$PIONC"
          python3 tools/mbt2pion_cli/tests/run_transpile_oracle.py --pionc "$PIONC"
          python3 tools/mbt2pion_cli/tests/run_transpile_oracle.py --emit-ci-golden "$PWD/out/mbt2pion-golden-linux" --pionc "$PIONC"
          python3 tools/mbt2pion_cli/tests/run_d2_oracle.py --pionc "$PIONC"
          python3 tools/mbt2pion_cli/tests/run_e1_oracle.py --pionc "$PIONC"
          python3 tools/mbt2pion_cli/tests/run_f3b_oracle.py --pionc "$PIONC"
          python3 tools/mbt2pion_cli/tests/run_f3c_oracle.py --pionc "$PIONC"
          python3 tools/mbt2pion_cli/tests/run_f3d1b_oracle.py --pionc "$PIONC"
          python3 tools/mbt2pion_cli/tests/run_f3d2_oracle.py --pionc "$PIONC"
          python3 tools/mbt2pion_cli/tests/run_f3d3_oracle.py --pionc "$PIONC"
          python3 tools/mbt2pion_cli/tests/run_f3e_oracle.py --pionc "$PIONC"
          python3 tools/mbt2pion_cli/tests/run_f3d1a_oracle.py --pionc "$PIONC"
          python3 tools/mbt2pion_cli/tests/run_f4_2_oracle.py --pionc "$PIONC"
          python3 tools/mbt2pion_cli/tests/run_f4_3_oracle.py --pionc "$PIONC"
          python3 tools/mbt2pion_cli/tests/run_f5_1_oracle.py --pionc "$PIONC"
          python3 tools/mbt2pion_cli/tests/run_f5_2_oracle.py --pionc "$PIONC"
          CMDS

      - name: Upload Linux x86_64 mbt2pion golden outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mbt2pion-golden-linux
          path: out/mbt2pion-golden-linux
          if-no-files-found: error
          retention-days: 7

      - name: Check 60s duration target
        run: |
          ELAPSED=$(( $(date +%s) - JOB_START_EPOCH ))
          echo "Job mbt2pion duration: ${ELAPSED}s"
          if [ "$ELAPSED" -gt 60 ]; then
            echo "::warning title=CI duration > 60s::mbt2pion took ${ELAPSED}s (target <= 60s, hard timeout 180s)"
          fi

  mbt2pion-cross-host-parity:
    name: mbt2pion macOS ARM64 == Linux x86_64 full-byte parity (incl. headers)
    runs-on: ubuntu-latest
    needs: [macos-arm64-bootstrap, mbt2pion]
    timeout-minutes: 3
    steps:
      - name: Record job start
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Download macOS ARM64 golden outputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mbt2pion-golden-macos
          path: golden-macos

      - name: Download Linux x86_64 golden outputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mbt2pion-golden-linux
          path: golden-linux

      - name: Enforce 100% file-set and full-byte equality (including headers)
        run: |
          diff -ru golden-macos golden-linux
          sha256sum golden-macos/*.pion golden-linux/*.pion
          echo "PASS: macOS ARM64 == Linux x86_64 full-byte identical (including headers)"

      - name: Check 60s duration target
        run: |
          ELAPSED=$(( $(date +%s) - JOB_START_EPOCH ))
          echo "Job mbt2pion-cross-host-parity duration: ${ELAPSED}s"
          if [ "$ELAPSED" -gt 60 ]; then
            echo "::warning title=CI duration > 60s::mbt2pion-cross-host-parity took ${ELAPSED}s (target <= 60s, hard timeout 180s)"
          fi
