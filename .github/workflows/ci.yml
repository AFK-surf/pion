name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-arm64:
    name: macOS ARM64 (verify-all, 9/9 self-hosting)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit CLI
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Toolchain versions
        run: |
          moon version
          cc --version
          python3 --version

      # 6/6 gates: Stage 0 unit tests, <64 KB runtime (O2 + TSan + ASan), 9/9
      # fixed-point bootstrap, fmt (UTF-8), std/json + std/http + dogfood app
      # tests, and cross ELF64 .o emission.
      - name: verify-all
        run: sh scripts/verify-all.sh

      - name: Upload Stage 2 SSA for the Linux cross-bootstrap
        uses: actions/upload-artifact@v4
        with:
          name: stage2-ssa
          path: out/stage2.ssa
          if-no-files-found: error
          retention-days: 7

  linux-x86_64:
    name: Linux x86_64 (zero-as ELF64, Stage 3 == Stage 4)
    runs-on: ubuntu-latest
    needs: macos-arm64
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential python3 file

      - name: Download Stage 2 SSA
        uses: actions/download-artifact@v4
        with:
          name: stage2-ssa
          path: .

      # Zero-`as` ELF64 objects, <64 KB runtime, real 4-client TCP loopback,
      # Stage 3 == Stage 4 bit-for-bit, std/json + std/http tests,
      # http_kv_service 8x500 TCP stress, V1 benchmark checksums.
      - name: test-linux
        run: M2_LINUX_SSA="$PWD/stage2.ssa" sh scripts/test-linux.sh
