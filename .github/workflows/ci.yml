name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-arm64:
    name: macOS ARM64 (verify-all, zero-MoonBit 9/9 self-hosting)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Toolchain versions
        run: |
          cc --version
          python3 --version

      # 6/6 gates: <64 KB runtime (O2 + TSan + ASan), 9/9 pure-Pion fixed-point
      # bootstrap from bootstrap/pionc-seed.ssa.gz + compiler/src/core unit tests,
      # fmt (UTF-8), std/* + dogfood app tests, pionc init smoke, e2e suites,
      # cross ELF64 .o emission, and examples/https_server + examples/pion_station
      # tests where Homebrew openssl@3 exists.
      - name: verify-all
        env:
          PION_REQUIRE_SANITIZERS: "1"
        run: sh scripts/verify-all.sh

      - name: Upload macOS ARM64 fixed-point SSA for the cross-host parity check
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage-ssa-macos-arm64
          path: out/stage2.ssa
          if-no-files-found: error
          retention-days: 7

      - name: Generate macOS ARM64 mbt2pion golden outputs for cross-host parity
        run: |
          PIONC="$PWD/out/pionc2"
          export PION_QBE="$PWD/out/qbe"
          export PION_RT_LIB="$PWD/out/libpionrt.a"
          python3 tools/mbt2pion_cli/tests/run_transpile_oracle.py \
            --emit-ci-golden "$PWD/out/mbt2pion-golden-macos" \
            --pionc "$PIONC"

      - name: Upload macOS ARM64 mbt2pion golden outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mbt2pion-golden-macos
          path: out/mbt2pion-golden-macos
          if-no-files-found: error
          retention-days: 7

  linux-x86_64:
    name: Linux x86_64 (zero-as ELF64, Stage 3 == Stage 4)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # libssl-dev/openssl: std/tls + HTTPS e2e; libsqlite3-dev/sqlite3: examples/pion_station
      # (SQLite WAL store, restart recovery cross-checked by the sqlite3 CLI).
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential python3 file libssl-dev openssl pkg-config libsqlite3-dev sqlite3

      # Independent native bootstrap straight from bootstrap/pionc-seed.ssa.gz (no
      # wait on macOS; the macOS == Linux SSA proof is stage-ssa-cross-host-parity).
      # Zero-`as` ELF64 objects, <64 KB runtime, real 4-client TCP loopback,
      # Stage 3 == Stage 4 bit-for-bit, compiler/src/core + std/* tests,
      # std/tls real OpenSSL TLS 1.3/1.2 handshakes, p17a/p22a/p25a/p26/p27/p29a e2e,
      # http_kv_service 8x500 TCP stress (close + keep-alive), examples/pion_station
      # (39 tests + run_e2e.sh: TLS/SSE/40 jobs, restart recovery, load), V1 benchmark checksums.
      - name: test-linux
        env:
          PION_REQUIRE_SANITIZERS: "1"
        run: sh scripts/test-linux.sh

      - name: Upload Linux x86_64 fixed-point SSA for the cross-host parity check
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage-ssa-linux-x64
          path: out/linux_stage.ssa
          if-no-files-found: error
          retention-days: 7

  stage-ssa-cross-host-parity:
    name: Self-hosting SSA macOS ARM64 == Linux x86_64 (byte-for-byte)
    runs-on: ubuntu-latest
    needs: [macos-arm64, linux-x86_64]
    timeout-minutes: 10
    steps:
      - name: Download macOS ARM64 fixed-point SSA
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: stage-ssa-macos-arm64
          path: macos

      - name: Download Linux x86_64 fixed-point SSA
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: stage-ssa-linux-x64
          path: linux

      # Both hosts bootstrap independently from the seed to their own fixed point
      # (macOS Stage 1 == Stage 2, Linux Stage 3 == Stage 4); the compiler's SSA
      # for itself must then be identical across host OS and architecture.
      - name: Enforce byte-for-byte equality
        run: |
          sha256sum macos/stage2.ssa linux/linux_stage.ssa
          cmp macos/stage2.ssa linux/linux_stage.ssa
          echo "PASS: macOS ARM64 == Linux x86_64 self-hosting SSA (byte-for-byte)"

  linux-arm64:
    name: Linux ARM64 (aarch64 native bootstrap, Stage 3 == Stage 4)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential python3 file libssl-dev openssl pkg-config libsqlite3-dev sqlite3

      # Independent native ARM64 Linux bootstrap straight from bootstrap/pionc-seed.ssa.gz:
      # <64 KB runtime, real 4-client TCP loopback, Stage 3 == Stage 4 bit-for-bit,
      # compiler/src/core + std/* tests, all E2E suites (incl. p29a multi-target + staticlib/cdylib),
      # std/tls, examples/pion_station, and V1 benchmark checksums.
      - name: test-linux (aarch64)
        env:
          PION_REQUIRE_SANITIZERS: "1"
        run: sh scripts/test-linux.sh

  windows-x86_64:
    name: Windows x86_64 (amd64_win native bootstrap, Stage 3 == Stage 4)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c # v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-openssl
            gzip
            diffutils

      # The runner image's own CPython (the MSYS2 one pulls in ncurses, tcl, tk and
      # more: ~20 s to unpack). Only its directory is added, after the MSYS2 ones;
      # the rest of the Windows PATH stays out (path-type: minimal).
      - name: Locate the runner's Python
        shell: pwsh
        run: |
          $py = (Get-Command python.exe -ErrorAction Stop).Source
          & $py --version
          "PION_WIN_PYTHON=$py" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Independent native Windows x86_64 bootstrap straight from bootstrap/pionc-seed.ssa.gz:
      # QBE T_amd64_win, <64 KB Win32 libpionrt.a, real 4-client 127.0.0.1 TCP loopback + WSAPoll,
      # Stage 3 == Stage 4 bit-for-bit (SSA + Win64 ASM), compiler/src/core + std/* tests,
      # p27a/p27c2 e2e, and V1 benchmark checksums.
      - name: test-windows (x86_64)
        run: |
          PY_EXE="$(cygpath -u "$PION_WIN_PYTHON")"
          export PATH="$PATH:$(dirname "$PY_EXE")"
          if ! command -v python3 >/dev/null 2>&1; then
            # No python3.exe next to python.exe: a one-line forwarder.
            PY_SHIM="$(mktemp -d)"
            printf '#!/bin/sh\nexec "%s" "$@"\n' "$PY_EXE" > "$PY_SHIM/python3"
            chmod +x "$PY_SHIM/python3"
            export PATH="$PATH:$PY_SHIM"
          fi
          python3 --version
          command -v openssl >/dev/null || { echo "FAIL: openssl CLI missing (std/tls e2e would be skipped)" >&2; exit 1; }
          sh scripts/test-windows.sh

  mbt2pion:
    name: mbt2pion + mbt_compat (fmt, check, test, wasm32, e2e, hygiene & oracle)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install build tools & MoonBit CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential python3 nodejs curl ca-certificates
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          "$HOME/.moon/bin/moon" version

      - name: Build pionc from standalone seed
        run: |
          mkdir -p out
          CC=cc sh scripts/build-qbe.sh out/qbe
          cc -std=c11 -O2 -fPIC -fno-unwind-tables -fno-asynchronous-unwind-tables -fno-ident -Wall -Wextra -Werror -c runtime/pion_rt.c -o out/pion_rt.o
          cc -std=c11 -O2 -fPIC -fno-unwind-tables -fno-asynchronous-unwind-tables -fno-ident -Wall -Wextra -Werror -c runtime/pion_cli.c -o out/pion_cli.o
          ar rcs out/libpionrt.a out/pion_rt.o
          ar rcs out/libpionrt_cli.a out/pion_rt.o out/pion_cli.o
          gzip -dc bootstrap/pionc-seed.ssa.gz > out/seed.ssa
          out/qbe -t amd64_sysv --obj -o out/pionc_seed.o out/seed.ssa
          cc out/pionc_seed.o out/libpionrt_cli.a -lm -lpthread -o out/pionc_seed
          PION_QBE="$PWD/out/qbe" PION_RT_LIB="$PWD/out/libpionrt_cli.a" out/pionc_seed build -o out/pionc compiler/src/core compiler/src/cli/main.pion

      - name: fmt, check, test, wasm32, e2e, hygiene & mandatory 3-target differential oracles
        env:
          PION_QBE: ${{ github.workspace }}/out/qbe
          PION_RT_LIB: ${{ github.workspace }}/out/libpionrt.a
        run: |
          PIONC="$PWD/out/pionc"
          command -v moon >/dev/null 2>&1 || { echo "FAIL: moon CLI missing" >&2; exit 1; }
          "$PIONC" fmt --check --json tools/mbt_compat tools/mbt2pion tools/mbt2pion_cli | grep -q '"ok":true'
          for pkg in tools/mbt_compat tools/mbt2pion tools/mbt2pion_cli; do
            "$PIONC" check --json "$pkg" | grep -q '"ok":true'
            TEST_OUT=$("$PIONC" test --json "$pkg")
            echo "$pkg -> $TEST_OUT"
            printf '%s' "$TEST_OUT" | grep -q '"ok":true'
            printf '%s' "$TEST_OUT" | grep -q '"failed":0'
          done
          # Project-agnostic hygiene check
          if grep -rnE '\b([Mm]onoid|still\.fail|[Ii]nvar)\b|\b(signals|view)::' tools/mbt_compat/src/ tools/mbt2pion/src/ tools/mbt2pion_cli/src/; then
            echo "FAIL: forbidden project-specific identifier found in tools/mbt*" >&2
            exit 1
          fi
          # Full E2E (golden + headers + real mbt_compat native & wasm32 + dual-path determinism + project-agnostic + negative & atomic tests + cross-pkg probes)
          sh tools/mbt2pion_cli/tests/run_e2e.sh "$PIONC"
          sh tools/mbt2pion_cli/tests/run_d2_e2e.sh "$PIONC"
          sh tools/mbt2pion_cli/tests/run_e1_e2e.sh "$PIONC"
          # Mandatory 3-target differential oracles (HARD FAIL if moon/pionc/node missing or any case/mutant fails)
          python3 tools/mbt_compat/oracle/run_oracle.py --no-bench --pionc "$PIONC"
          python3 tools/mbt2pion_cli/tests/run_transpile_oracle.py --pionc "$PIONC"
          python3 tools/mbt2pion_cli/tests/run_d2_oracle.py --pionc "$PIONC"
          python3 tools/mbt2pion_cli/tests/run_e1_oracle.py --pionc "$PIONC"
          python3 tools/mbt2pion_cli/tests/run_f3b_oracle.py --pionc "$PIONC"
          python3 tools/mbt2pion_cli/tests/run_f3c_oracle.py --pionc "$PIONC"
          python3 tools/mbt2pion_cli/tests/run_f3d2_oracle.py --pionc "$PIONC"
          python3 tools/mbt2pion_cli/tests/run_f3d3_oracle.py --pionc "$PIONC"
          python3 tools/mbt2pion_cli/tests/run_f3e_oracle.py --pionc "$PIONC"
          # Generate Linux x86_64 golden outputs for cross-host byte-for-byte parity check
          python3 tools/mbt2pion_cli/tests/run_transpile_oracle.py \
            --emit-ci-golden "$PWD/out/mbt2pion-golden-linux" \
            --pionc "$PIONC"

      - name: Upload Linux x86_64 mbt2pion golden outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mbt2pion-golden-linux
          path: out/mbt2pion-golden-linux
          if-no-files-found: error
          retention-days: 7

  mbt2pion-cross-host-parity:
    name: mbt2pion macOS ARM64 == Linux x86_64 full-byte parity (incl. headers)
    runs-on: ubuntu-latest
    needs: [macos-arm64, mbt2pion]
    timeout-minutes: 10
    steps:
      - name: Download macOS ARM64 golden outputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mbt2pion-golden-macos
          path: golden-macos

      - name: Download Linux x86_64 golden outputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mbt2pion-golden-linux
          path: golden-linux

      - name: Enforce 100% file-set and full-byte equality (including headers)
        run: |
          diff -ru golden-macos golden-linux
          sha256sum golden-macos/*.pion golden-linux/*.pion
          echo "PASS: macOS ARM64 == Linux x86_64 full-byte identical (including headers)"
