[package]
name = "tls"
version = "0.1.0"

[dependencies]
http = { path = "../http" }
json = { path = "../json" }

[link.linux]
c_sources = ["csrc/tls_openssl.c"]
libs = ["ssl", "crypto"]

[link.macos]
c_sources = ["csrc/tls_macos.c"]
cc_flags = ["-fblocks"]
frameworks = ["Network", "Security", "CoreFoundation"]

[link.windows]
c_sources = ["csrc/tls_win.c"]
libs = ["secur32", "crypt32", "ws2_32"]
